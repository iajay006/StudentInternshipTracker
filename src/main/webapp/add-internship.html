<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Internship | Student Internship Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 650px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px #ddd;
        }

        h1 {
            color: #4338ca;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button, .back {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #4338ca;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .back {
            background: #6b7280;
        }

        button:hover, .back:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Add Internship</h1>

        <form action="add-internship" method="post">

            <label for="company">Company Name *</label>
            <input type="text" id="company" name="company" required>

            <label for="role">Job Role *</label>
            <input type="text" id="role" name="role" required>

            <label for="location">Location</label>
            <input type="text" id="location" name="location">

            <label for="stipend">Monthly Stipend (₹)</label>
            <input type="number" id="stipend" name="stipend"
                   min="0" step="0.01" value="0">

            <label for="status">Application Status</label>
            <select id="status" name="status">
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Selected">Selected</option>
                <option value="Rejected">Rejected</option>
            </select>

            <label for="appliedDate">Applied Date</label>
            <input type="date" id="appliedDate" name="appliedDate">

            <label for="deadline">Application Deadline</label>
            <input type="date" id="deadline" name="deadline">

            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="4"
                      placeholder="Enter additional details"></textarea>

            <button type="submit">Save Internship</button>

            <a href="dashboard" class="back">Back to Dashboard</a>

        </form>

    </div>

</body>
</html>
