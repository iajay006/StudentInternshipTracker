<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Student Internship Tracker</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #f4f7fc;
            font-family: Arial, sans-serif;
            color: #243047;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #2456b3;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #68758a;
            margin-bottom: 28px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 7px;
            background: #2456b3;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .btn:hover {
            background: #193f89;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #15284a12;
            border-top: 4px solid #2456b3;
        }

        .card h3 {
            font-size: 15px;
            color: #68758a;
            margin: 0 0 18px;
        }

        .number {
            font-size: 34px;
            font-weight: bold;
            color: #2456b3;
        }

        .info {
            margin-top: 28px;
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #15284a12;
        }

        .info h2 {
            margin-top: 0;
            font-size: 20px;
        }

        @media (max-width: 750px) {
            body {
                padding: 18px;
            }

            .cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 420px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Student Dashboard</h1>
        <p class="subtitle">Manage and track your internship applications.</p>

        <div class="buttons">
            <a class="btn" href="index.html">Home</a>
            <a class="btn" href="internships">My Internships</a>
            <a class="btn" href="add-internship.html">+ Add Internship</a>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Total Internships</h3>
                <div class="number" id="total">0</div>
            </div>

            <div class="card">
                <h3>Applied</h3>
                <div class="number" id="applied">0</div>
            </div>

            <div class="card">
                <h3>Selected</h3>
                <div class="number" id="selected">0</div>
            </div>

            <div class="card">
                <h3>Rejected</h3>
                <div class="number" id="rejected">0</div>
            </div>
        </div>

        <div class="info">
            <h2>Internship Overview</h2>
            <p id="message">Loading your internship statistics...</p>
        </div>

    </div>

    <script>
        fetch("internships")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Unable to load internships");
                }
                return response.text();
            })
            .then(html => {
                // The internships endpoint returns an HTML page.
                // Do not parse it as JSON.
                document.getElementById("message").textContent =
                    "Open My Internships to view your saved records.";
            })
            .catch(() => {
                document.getElementById("message").textContent =
                    "Your internship records could not be loaded here yet.";
            });
    </script>
    <script src="js/script.js"></script>
</body>
</html>
